<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto de Venta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col pb-16 md:pb-0">

  <!-- HEADER + NAVEGACIÓN COMPUTADORA -->
  <header class="bg-blue-600 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-4xl mx-auto p-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">🛒 Sistema POS</h1>
      
      <!-- Pestañas para COMPUTADORA (pantallas md o más grandes) -->
      <nav class="hidden md:flex space-x-2">
        <button onclick="switchTab('sales')" id="desk-nav-sales" class="px-4 py-2 rounded-lg font-semibold text-sm bg-blue-700 text-white">
          🛍️ Venta
        </button>
        <button onclick="switchTab('cart')" id="desk-nav-cart" class="px-4 py-2 rounded-lg font-semibold text-sm bg-blue-600 text-blue-100 hover:bg-blue-700 relative">
          🧾 Carrito
          <span id="desk-cart-badge" class="hidden bg-red-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span>
        </button>
        <button onclick="switchTab('inventory')" id="desk-nav-inventory" class="px-4 py-2 rounded-lg font-semibold text-sm bg-blue-600 text-blue-100 hover:bg-blue-700">
          📦 Inventario
        </button>
      </nav>

      <span class="text-xs bg-blue-700 px-2 py-1 rounded hidden sm:inline">En línea</span>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 p-4 max-w-4xl mx-auto w-full">
    
    <!-- PESTAÑA 1: VENTA / CATÁLOGO -->
    <section id="tab-sales" class="tab-content space-y-4">
      <h2 class="text-lg font-bold text-gray-700">Catálogo de Productos</h2>
      <div id="catalog-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <p class="text-gray-400 text-sm col-span-full">Cargando catálogo...</p>
      </div>
    </section>

    <!-- PESTAÑA 2: INVENTARIO (Agregar / Ver / Borrar) -->
    <section id="tab-inventory" class="tab-content hidden space-y-6">
      <div class="bg-white p-4 rounded-lg shadow-md">
        <h2 class="text-lg font-bold mb-3 text-gray-700">➕ Agregar Nuevo Producto</h2>
        <form id="form-product" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="text" id="p-name" placeholder="Nombre (ej. Coca Cola)" class="border p-2 text-sm rounded sm:col-span-2" required>
          <input type="text" id="p-cat" placeholder="Categoría" class="border p-2 text-sm rounded" required>
          <input type="number" step="0.5" id="p-price" placeholder="Precio ($)" class="border p-2 text-sm rounded" required>
          <input type="number" id="p-stock" placeholder="Stock disponible" class="border p-2 text-sm rounded sm:col-span-2" required>
          <button type="submit" class="sm:col-span-2 bg-green-600 text-white font-bold py-2 text-sm rounded hover:bg-green-700 transition">
            Guardar en Inventario
          </button>
        </form>
      </div>

      <div class="bg-white p-4 rounded-lg shadow-md">
        <h2 class="text-lg font-bold mb-3 text-gray-700">📦 Control de Inventario</h2>
        <div id="inventory-list" class="space-y-2">
          <p class="text-gray-400 text-sm">Cargando inventario...</p>
        </div>
      </div>
    </section>

    <!-- PESTAÑA 3: CARRITO & COBRO -->
    <section id="tab-cart" class="tab-content hidden space-y-4 max-w-lg mx-auto">
      <div class="bg-white p-4 rounded-lg shadow-md">
        <h2 class="text-lg font-bold mb-3 text-gray-700">🧾 Detalle de la Venta</h2>
        <div id="cart-items" class="space-y-2 mb-4 max-h-60 overflow-y-auto">
          <p class="text-gray-400 text-sm">El carrito está vacío.</p>
        </div>
        <div class="border-t pt-3 flex justify-between text-xl font-bold mb-4">
          <span>Total:</span>
          <span id="cart-total">$0.00</span>
        </div>
        <button id="btn-checkout" onclick="checkout()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50" disabled>
          Cobrar
        </button>
      </div>
    </section>

  </main>

  <!-- NAVEGACIÓN INFERIOR PARA CELULAR (pantallas pequeñas) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 shadow-lg z-20">
    <button onclick="switchTab('sales')" id="mob-nav-sales" class="flex flex-col items-center text-blue-600 font-bold text-xs">
      <span class="text-lg">🛍️</span>
      Venta
    </button>
    <button onclick="switchTab('cart')" id="mob-nav-cart" class="flex flex-col items-center text-gray-500 text-xs relative">
      <span class="text-lg">🧾</span>
      Carrito
      <span id="mob-cart-badge" class="hidden absolute -top-1 right-2 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
    </button>
    <button onclick="switchTab('inventory')" id="mob-nav-inventory" class="flex flex-col items-center text-gray-500 text-xs">
      <span class="text-lg">📦</span>
      Inventario
    </button>
  </nav>

  <script>
    const API_URL = "https://pos-backend-api.nunezalfonso313.workers.dev/api";
    let cart = [];
    let products = [];

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabName}`).classList.remove('hidden');

      // Actualizar estilo en Celular
      ['sales', 'cart', 'inventory'].forEach(t => {
        const mobBtn = document.getElementById(`mob-nav-${t}`);
        if (mobBtn) {
          mobBtn.className = t === tabName 
            ? "flex flex-col items-center text-blue-600 font-bold text-xs relative" 
            : "flex flex-col items-center text-gray-500 text-xs relative";
        }
        
        // Actualizar estilo en PC
        const deskBtn = document.getElementById(`desk-nav-${t}`);
        if (deskBtn) {
          deskBtn.className = t === tabName
            ? "px-4 py-2 rounded-lg font-semibold text-sm bg-blue-700 text-white relative"
            : "px-4 py-2 rounded-lg font-semibold text-sm bg-blue-600 text-blue-100 hover:bg-blue-700 relative";
        }
      });
    }

    async function fetchProducts() {
      try {
        const res = await fetch(`${API_URL}/products`);
        products = await res.json();
        renderCatalog();
        renderInventory();
      } catch (err) {
        console.error("Error al cargar productos:", err);
      }
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-list');
      if (!products || products.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm col-span-full">No hay productos registrados.</p>';
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="border p-3 rounded-lg flex justify-between items-center bg-white shadow-sm">
          <div>
            <h3 class="font-bold text-gray-800 text-sm">${p.name}</h3>
            <p class="text-xs text-gray-500">${p.category} | Stock: ${p.stock}</p>
            <p class="text-sm font-semibold text-green-600">$${p.price}</p>
          </div>
          <button onclick="addToCart('${p.id}')" class="bg-blue-600 text-white px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-blue-700">
            + Agregar
          </button>
        </div>
      `).join('');
    }

    function renderInventory() {
      const container = document.getElementById('inventory-list');
      if (!products || products.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm">Sin productos en inventario.</p>';
        return;
      }
      container.innerHTML = products.map(p => `
        <div class="border p-2 rounded flex justify-between items-center text-xs bg-gray-50">
          <div>
            <span class="font-bold text-gray-800">${p.name}</span>
            <span class="text-gray-500">($${p.price} - Stock: ${p.stock})</span>
          </div>
          <button onclick="deleteProduct('${p.id}')" class="bg-red-500 text-white px-2 py-1 rounded text-xs hover:bg-red-600">
            🗑️ Borrar
          </button>
        </div>
      `).join('');
    }

    document.getElementById('form-product').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newProd = {
        id: "p_" + Date.now(),
        name: document.getElementById('p-name').value,
        category: document.getElementById('p-cat').value,
        price: parseFloat(document.getElementById('p-price').value),
        stock: parseInt(document.getElementById('p-stock').value)
      };

      await fetch(`${API_URL}/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newProd)
      });

      e.target.reset();
      fetchProducts();
      alert("Producto agregado correctamente.");
    });

    async function deleteProduct(id) {
      if (!confirm("¿Seguro que deseas eliminar este producto?")) return;
      try {
        await fetch(`${API_URL}/products/${id}`, { method: 'DELETE' });
        fetchProducts();
      } catch (err) {
        console.error("Error al borrar:", err);
      }
    }

    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;
      
      const item = cart.find(c => c.id === id);
      if (item) {
        item.qty++;
      } else {
        cart.push({ ...prod, qty: 1 });
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');
      const btn = document.getElementById('btn-checkout');
      const mobBadge = document.getElementById('mob-cart-badge');
      const deskBadge = document.getElementById('desk-cart-badge');

      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);

      [mobBadge, deskBadge].forEach(b => {
        if (b) {
          if (totalItems > 0) {
            b.innerText = totalItems;
            b.classList.remove('hidden');
          } else {
            b.classList.add('hidden');
          }
        }
      });

      if (cart.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm">El carrito está vacío.</p>';
        totalEl.innerText = '$0.00';
        btn.disabled = true;
        return;
      }

      let total = 0;
      container.innerHTML = cart.map(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        return `
          <div class="flex justify-between text-sm items-center border-b pb-1">
            <span>${item.name} x${item.qty}</span>
            <span class="font-semibold">$${subtotal.toFixed(2)}</span>
          </div>
        `;
      }).join('');

      totalEl.innerText = `$${total.toFixed(2)}`;
      btn.disabled = false;
    }

    function checkout() {
      alert("¡Venta completada con éxito!");
      cart = [];
      renderCart();
      switchTab('sales');
    }

    fetchProducts();
  </script>
</body>
</html>
